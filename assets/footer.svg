    <text x="100" y="122">LINKEDIN</text>
    <text x="100" y="156">EMAIL</text>
    <text x="100" y="190">ATELIER</text>
  </g>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" letter-spacing="-1">
    <text x="590" y="108">LET'S</text>
    <text x="590" y="150">BUILD</text>
    <text x="590" y="192">SOMETHING</text>
  </g>
  <g fill="#8d6a4f" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">
