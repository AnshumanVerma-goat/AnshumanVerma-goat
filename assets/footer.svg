<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Footer composition</title>
  <desc id="desc">Minimal editorial footer with contact typography and geometric frame.</desc>
  <rect width="1200" height="260" fill="#f4efe8"/>
  <g stroke="#141414" stroke-opacity="0.2" stroke-width="1">
    <path d="M0 52H1200M0 208H1200M100 0V260M1100 0V260"/>
  </g>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="4">
