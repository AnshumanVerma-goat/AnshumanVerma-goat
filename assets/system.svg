<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Process architecture</title>
  <desc id="desc">System development pipeline: discover, model, design, engineer, ship, iterate.</desc>
  <rect width="1200" height="460" fill="#f4efe8"/>
  <g stroke="#141414" stroke-opacity="0.2" stroke-width="1">
    <path d="M0 80H1200M0 380H1200M90 0V460M1110 0V460"/>
  </g>
  <text x="90" y="60" fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4">05 / HOW I BUILD</text>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">
    <text x="110" y="126">DISCOVER</text>
    <text x="320" y="126">MODEL</text>
    <text x="520" y="126">DESIGN</text>
    <text x="740" y="126">ENGINEER</text>
    <text x="960" y="126">SHIP</text>
  </g>
  <g stroke="#141414" stroke-width="2" fill="none">
    <path d="M190 170H322M322 170H500M500 170H700M700 170H918M918 170H1042"/>
    <path d="M190 170V228H322V170M322 170V228H500V170M500 170V228H700V170M700 170V228H918V170M918 170V228H1042V170"/>
    <path d="M190 170L146 228"/>
    <path d="M1042 170L1086 228"/>
  </g>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1.2">
    <text x="130" y="290">Problem and context.</text>
    <text x="332" y="290">System and architecture.</text>
    <text x="534" y="290">Structure and visual direction.</text>
    <text x="750" y="290">Interfaces and services.</text>
    <text x="974" y="290">Launch and learn.</text>
  </g>
  <g fill="#8d6a4f" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">
    <text x="90" y="408">DISCOVER → MODEL → DESIGN → ENGINEER → SHIP → ITERATE</text>
  </g>
</svg>
