<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">Editorial grid</title>
  <desc id="desc">Minimal architectural grid with coordinates and metadata lines for the profile.</desc>
  <rect width="600" height="420" fill="#f4efe8"/>
  <g stroke="#141414" stroke-opacity="0.22" stroke-width="1">
    <path d="M0 60H600M0 180H600M0 300H600M60 0V420M180 0V420M300 0V420M420 0V420M540 0V420"/>
  </g>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">
    <text x="28" y="34">INDIA</text>
    <text x="500" y="34" text-anchor="end">2026</text>
    <text x="28" y="394">FULL-STACK</text>
    <text x="500" y="394" text-anchor="end">CREATIVE TECHNOLOGY</text>
  </g>
  <g fill="#141414" font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="40" y="172" font-size="62" letter-spacing="-3">A</text>
    <text x="110" y="228" font-size="74" letter-spacing="-3">N</text>
    <text x="178" y="286" font-size="86" letter-spacing="-3">S</text>
    <text x="248" y="344" font-size="92" letter-spacing="-3">H</text>
  </g>
  <rect x="408" y="124" width="136" height="128" fill="none" stroke="#8d6a4f" stroke-width="2"/>
  <g fill="#8d6a4f" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3">
    <text x="432" y="168">SYSTEMS</text>
    <text x="432" y="196">CODE</text>
    <text x="432" y="224">DESIGN</text>
  </g>
</svg>
